[project]
name = "bridge-backend"
version = "0.1.0"
description = "BRIDGE: AI-powered adaptive workplace simulation and competency assessment platform (backend API)."
requires-python = ">=3.12"
# Direct dependencies with compatible ranges. Exact, tested versions live in requirements.lock.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.2",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "argon2-cffi>=23.1",
    "email-validator>=2.2,<3.0",
    "pyyaml>=6.0",
    "anthropic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["services/demo_resources/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
# B008: FastAPI's Depends() in defaults is idiomatic.
# E501: `ruff format` owns line length; long user-facing strings are left intact.
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder must not make the alembic library look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
